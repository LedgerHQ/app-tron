name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

jobs:
  security-review:
    # Runs automatically on every PR update, or on demand by (re-)applying the
    # "security-review" label from the PR sidebar.
    if: github.event.action != 'labeled' || github.event.label.name == 'security-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Run Claude Security Review
        id: claude-security-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the security-review skill (see ledger-app-ai-instructions/skills/SECURITY.REVIEW.md)
            against the changes in PR #${{ github.event.pull_request.number }} of
            ${{ github.repository }} compared to its base branch.

            Once the final report is ready, post it as a single PR comment with:
              gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file <path-to-report>
          claude_args: '--allowedTools "Bash(gh pr comment:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove the trigger label
        if: github.event.action == 'labeled'
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label security-review
        env:
          GH_TOKEN: ${{ github.token }}
